{% extends "base.html" %}
{% block title %}Cari Permohonan{% endblock %}
{% block content %}
<h4 class="fw-bold mb-3">Cari Permohonan</h4>

<form class="mb-2" id="form-cari" onsubmit="event.preventDefault();">
  <input class="form-control mb-2" id="input-q" placeholder="Cari berdasarkan nama, lokasi, atau kecamatan" autofocus>
</form>

<div class="d-flex gap-2 mb-3" id="scope-buttons">
  <button type="button" class="btn btn-sm btn-dark scope-btn" data-scope="semua">Semua</button>
  <button type="button" class="btn btn-sm btn-outline-secondary scope-btn" data-scope="nama">Nama</button>
  <button type="button" class="btn btn-sm btn-outline-secondary scope-btn" data-scope="kecamatan">Kecamatan</button>
</div>

<div class="text-secondary mb-2" style="font-size:13px" id="txt-search-info"></div>

<div class="bg-white rounded" id="container-hasil"></div>

<!-- JavaScript Logic -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    let currentScope = 'semua';
    const inputQ = document.getElementById('input-q');
    const scopeBtns = document.querySelectorAll('.scope-btn');
    const txtInfo = document.getElementById('txt-search-info');
    const container = document.getElementById('container-hasil');

    function doSearch() {
        const q = inputQ.value.trim();
        if (!q) {
            txtInfo.innerText = '';
            container.innerHTML = '';
            return;
        }

        fetch(`/api/permohonan-cari?q=${encodeURIComponent(q)}&scope=${currentScope}`)
            .then(res => res.json())
            .then(data => {
                txtInfo.innerText = `${data.results.length} hasil ditemukan untuk “${data.q}”`;
                container.innerHTML = '';

                if (!data.results || data.results.length === 0) {
                    container.innerHTML = '<div class="text-secondary text-center py-3" style="font-size:13px">Tidak ada hasil.</div>';
                    return;
                }

                data.results.forEach(r => {
                    const badgeClass = r.jenis === 'SIB' ? 'badge-sib' : 'badge-bk';
                    const item = `
                    <a href="/permohonan/${r.id}/edit" class="d-flex justify-content-between align-items-center text-decoration-none text-dark p-2 border-bottom">
                      <div>
                        <span class="fw-bold">${r.nama_pelanggan}</span>
                        <div class="text-secondary" style="font-size:12px">${r.kecamatan || '—'} &mdash; masuk ${r.tanggal_permohonan || '—'}</div>
                      </div>
                      <span class="badge ${badgeClass}">${r.jenis}</span>
                    </a>`;
                    container.insertAdjacentHTML('beforeend', item);
                });
            });
    }

    inputQ.addEventListener('input', doSearch);

    scopeBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            scopeBtns.forEach(b => {
                b.classList.remove('btn-dark');
                b.classList.add('btn-outline-secondary');
            });
            this.classList.remove('btn-outline-secondary');
            this.classList.add('btn-dark');
            currentScope = this.getAttribute('data-scope');
            doSearch();
        });
    });
});
</script>
{% endblock %}
