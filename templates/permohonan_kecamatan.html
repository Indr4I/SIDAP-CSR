{% extends "base.html" %}
{% block title %}Permohonan per Kecamatan{% endblock %}
{% block content %}
<h4 class="fw-bold mb-1">Permohonan &mdash; Kecamatan</h4>
<div class="text-secondary mb-3" style="font-size:13px" id="txt-info-kecamatan">Memuat data kecamatan...</div>

<div class="row g-3" id="container-kecamatan">
  <div class="col-12 text-secondary py-3">Sedang mengambil data...</div>
</div>

<!-- JavaScript Logic -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    fetch('/api/permohonan-kecamatan-stats')
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('container-kecamatan');
            const txtInfo = document.getElementById('txt-info-kecamatan');

            txtInfo.innerText = `${data.rows.length} kecamatan tercakup — klik satu untuk melihat rincian permohonan`;
            container.innerHTML = '';

            if (!data.rows || data.rows.length === 0) {
                container.innerHTML = '<div class="col-12 text-secondary" style="font-size:13px">Belum ada data permohonan.</div>';
                return;
            }

            data.rows.forEach(r => {
                const html = `
                <div class="col-4">
                  <a href="/permohonan?kecamatan=${encodeURIComponent(r.kecamatan)}" class="text-decoration-none text-dark">
                    <div class="stat-card">
                      <div class="fw-bold mb-2" style="font-size:14px">${r.kecamatan}</div>
                      <div class="d-flex justify-content-between" style="font-size:12px">
                        <span class="text-secondary">Total</span><span class="fw-bold">${r.total}</span>
                      </div>
                      <div class="d-flex justify-content-between" style="font-size:12px">
                        <span class="text-secondary">SIB / BK</span><span class="fw-bold">${r.sib} / ${r.bk}</span>
                      </div>
                      <div class="d-flex justify-content-between" style="font-size:12px">
                        <span class="text-secondary">Menunggu</span><span class="fw-bold">${r.menunggu}</span>
                      </div>
                      <div class="d-flex justify-content-between" style="font-size:12px">
                        <span class="text-secondary">Selisih</span><span class="fw-bold" style="color:#b45309">${r.selisih}</span>
                      </div>
                      <div class="d-flex justify-content-between" style="font-size:12px">
                        <span class="text-secondary">Sudah terpasang</span><span class="fw-bold" style="color:#15803d">${r.selesai}</span>
                      </div>
                    </div>
                  </a>
                </div>`;
                container.insertAdjacentHTML('beforeend', html);
            });
        })
        .catch(err => {
            console.error(err);
            document.getElementById('container-kecamatan').innerHTML = '<div class="col-12 text-danger">Gagal memuat data.</div>';
        });
});
</script>
{% endblock %}
